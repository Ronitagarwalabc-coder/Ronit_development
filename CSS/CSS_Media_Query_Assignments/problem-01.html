<!DOCTYPE html>
<html>
<head>
    <title>Media Query Grid</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 80%;
            margin: 40px auto;

            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: 60px 150px;

            gap: 10px;

            grid-template-areas:
                "nav nav nav nav"
                "box1 box2 box3 box4";
        }

        .nav {
            background-color: yellow;
            padding: 10px;
            font-size: 25px;
            grid-area: nav;
        }

        .box {
            padding: 10px;
            font-size: 15px;
        }

        .box1 {
            background-color: red;
            grid-area: box1;
        }

        .box2 {
            background-color: lime;
            grid-area: box2;
        }

        .box3 {
            background-color: #5864e8;
            grid-area: box3;
        }

        .box4 {
            background-color: #999;
            grid-area: box4;
        }


        /* MEDIUM SCREEN */

        @media (max-width: 800px) {

            .container {
                width: 80%;

                grid-template-columns: 1fr 1fr;
                grid-template-rows: 60px 160px 160px;

                grid-template-areas:
                    "nav nav"
                    "box1 box3"
                    "box2 box4";
            }

        }


        /* SMALL SCREEN */

        @media (max-width: 500px) {

            .container {
                width: 60%;

                grid-template-columns: 1fr;
                grid-template-rows: 60px 105px 105px 105px 105px;

                grid-template-areas:
                    "nav"
                    "box1"
                    "box4"
                    "box2"
                    "box3";
            }

        }

    </style>
</head>

<body>

    <div class="container">

        <div class="nav">Navigation</div>

        <div class="box box1">Box 1</div>

        <div class="box box2">Box 2</div>

        <div class="box box3">Box 3</div>

        <div class="box box4">Box 4</div>

    </div>

</body>
</html>
