<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Listing Portal - Now Showing</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #111827;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 30px 20px;
        }

        h2 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 24px;
            color: #000000;
        }

        button {
            cursor: pointer;
            border: none;
            outline: none;
            font-size: 12px;
            font-weight: 500;
            transition: opacity 0.2s ease, transform 0.1s ease;
        }

        button:hover {
            opacity: 0.9;
        }

        button:active {
            transform: scale(0.98);
        }

        h3, p {
            line-height: 1.3;
        }

        .release-date, .book-btn {
            font-size: 13px;
        }

        #main-portal {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
        }

        #movie-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        .movie-card {
            display: flex;
            flex-direction: row;
            background-color: #ffffff;
            border: 1px solid #fecdd3; /* Light pink border matching target image */
            border-radius: 4px;
            overflow: hidden;
            height: 130px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
        }

        .poster-container {
            width: 130px;
            min-width: 130px;
            height: 100%;
            position: relative;
            background-color: #1f2937;
            overflow: hidden;
        }

        .poster-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .card-details {
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex: 1;
        }

        .movie-title {
            font-size: 15px;
            font-weight: 700;
            color: #000000;
        }

        .release-date {
            color: #4b5563;
            margin-top: 2px;
        }

        .book-btn {
            background-color: #f43f5e; /* Vibrant pink/red matching reference */
            color: #ffffff;
            padding: 6px 16px;
            border-radius: 20px; /* Pill shape */
            width: fit-content;
            margin-top: 8px;
            display: inline-block;
        }

        /* Responsive design fallback for narrow viewports */
        @media (max-width: 680px) {
            #movie-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <main id="main-portal">
        <div id="movie-container">

            <!-- Movie 1: ET (2022) -->
            <article class="movie-card">
                <div class="poster-container">
                    <img class="poster-img" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTJc8oUBkVGlEoPidIEvyANVKfkMlsfA-4NH0dbMa7R4W19ICTbCKKBLTHd&s=10">
                </div>
                <div class="card-details">
                    <div>
                        <h3 class="movie-title">ET (2022)</h3>
                        <p class="release-date">Releasing on 11 Mar, 2022</p>
                    </div>
                    <button class="book-btn">Book tickets</button>
                </div>
            </article>

            <!-- Movie 2: Jhund -->
            <article class="movie-card">
                <div class="poster-container">
                    <img class="poster-img" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRgr5o1rEhSqPj6B8DWg7wkUCiLRlT6NezMv8ZA7lCVhw&s=10">
                </div>
                <div class="card-details">
                    <div>
                        <h3 class="movie-title">Jhund</h3>
                        <p class="release-date">Releasing on 11 Mar, 2022</p>
                    </div>
                    <button class="book-btn">Book tickets</button>
                </div>
            </article>

            <!-- Movie 3: Gangubai Kathiawadi -->
            <article class="movie-card">
                <div class="poster-container">
                    <img class="poster-img" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS9z0M39Bdu_95ig8nLkVu411SIDGlATCMSZO70ItFm8w&s">
                </div>
                <div class="card-details">
                    <div>
                        <h3 class="movie-title">Gangubai Kathiawadi</h3>

                    </div>

                </div>

            <!-- Movie 4: Radhe Shyam -->

                </div>

                    <div>

            <!-- Movie 5: Uncharted -->
            <article class="movie-card">
                <div class="poster-container">

                </div>

                </div>
                <div class="card-details">
                    <div>
                        <h3 class="movie-title">The Batman</h3>
                        <p class="release-date">Releasing on 11 Mar, 2022</p>
                    </div>
                    <button class="book-btn">Book tickets</button>
                </div>
            </article>

        </div>
    </main>
</body>
</html>
